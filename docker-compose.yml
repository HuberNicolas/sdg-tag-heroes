services:
  portainer:
    build:
      context: .
      dockerfile: deploy/portainer.Dockerfile
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "1000:9000"
    env_file:
      - ./env/portainer.env
    profiles: [ prod ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.15

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: api
    environment:
      DOCKER_SERVICE: "api"
      IN_DOCKER: true
      # Model whose predictions drive maps, levels and quests: Aurora (thesis data) or Dvdblk (dummy dataset)
      PREDICTION_MODEL: ${PREDICTION_MODEL:-Aurora}
      POETRY_HTTP_TIMEOUT: "300"
    volumes:
      - ./api:/api
      - ./models:/models
      - ./db:/db
      - ./request_models:/request_models
      - ./schemas:/schemas
      - ./enums:/enums
      - ./settings:/settings
      - ./services:/services
      - ./utils:/utils
      - ./data/api:/data/api # UMAP models; mounted so new models do not need an image rebuild
      - ./data/docker/logs:/logs
    ports:
      - "1002:8001"
    profiles: [ prod ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.2

  mariadb:
    container_name: mariadb-database
    build:
      context: .
      dockerfile: deploy/db/mariadb.Dockerfile
    restart: always
    ports:
      - "2001:3306"
    volumes:
      - ./data/docker/db/mariadb/mysql-data/:/var/lib/mysql
      # - ./data/db/igcl-dump.sql:/docker-entrypoint-initdb.d/dump.sql # Change, as we currently mounting a folder
    env_file:
      - ./env/mariadb.env
    profiles: [ prod ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.6

  phpmyadmin:
    container_name: phpmyadmin
    build:
      context: .
      dockerfile: deploy/db/phpmyadmin.Dockerfile
    restart: unless-stopped
    ports:
      - "2011:80"
    depends_on:
      - mariadb
    env_file:
      - ./env/phpmyadmin.env
    profiles: [ prod ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.7

  mongodb:
    container_name: mongodb-database
    build:
      context: .
      dockerfile: deploy/db/mongodb.Dockerfile
    restart: always
    ports:
      - "2002:27017"
    volumes:
      - ./data/docker/db/mongodb/mongodb-data:/data/db
    env_file:
      - ./env/mongodb.env
    profiles: [ prod ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.8

  mongo-express:
    container_name: mongo-express
    build:
      context: .
      dockerfile: deploy/db/mongoexpress.Dockerfile
    restart: always
    ports:
      - "2022:8081"
    depends_on:
      - mongodb
    env_file:
      - ./env/mongo-express.env
    profiles: [ prod ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.9

  qdrantdb:
    build:
      context: .
      dockerfile: deploy/db/qdrantdb.Dockerfile
    restart: always
    container_name: qdrant-database
    environment:
      - QDRANT_LOG_LEVEL=debug
    ports:
      - "2003:6333"
    volumes:
      - ./data/docker/db/qdrantdb/storage:/qdrant/storage
    profiles: [ prod ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.10

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    container_name: frontend
    environment:
      HMR_CLIENT_PORT: 3030
    ports:
      - "3030:3000"
    volumes:
      - ./frontend:/app # Mount the local frontend folder into /app inside the container
      - /app/node_modules # Ensure node_modules inside the container is separate
      - /app/.nuxt # Keep Nuxt's build output separate from a local `npm run dev` (it contains absolute paths)
      - ./frontend/components:/app/components # line to mount components specifically
      - ./frontend/composables:/app/composables # line to mount composables specifically
    profiles: [ prod ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.14

  utils:
    build:
      context: .
      dockerfile: deploy/utils.Dockerfile
    container_name: utils
    restart: always
    tty: true # Keep the container running
    profiles: [ dev, debug ]
    networks:
      sdg-tag-heroes-net:
        ipv4_address: 10.5.0.20
    # To delete things, mount here
    volumes:
      # - /path/on/server/:/path/on/dockerservice/on/service
      #  - /home/deployer/recycle-bin:/recycle-bin
      - ./data/db/:/workspace/
      #- ./data/db/igcl_dump.sql:/workspace/igcl_dump.sql
      - ./utils/restore-qdrant.sh:/workspace/restore-qdrant.sh
      #- ./data/db/publications-mt-4595442005324815-2024-11-15-13-46-47.snapshot:/workspace/publications-mt-4595442005324815-2024-11-15-13-46-47.snapshot
      #- ./data/db/2024-11-15-v2/backup/sdg_explanations.zip:/workspace/sdg_explanations.zip
    entrypoint: [ "tail", "-f", "/dev/null" ] # Keep container alive for interactive use

networks:
  sdg-tag-heroes-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.1

volumes:
  portainer_data:
